name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aqua ${{ github.ref_name }}
          body_path: .github/release-body.md
          files: |
            lib/client.js
            install.ps1
            SHA256SUMS.txt
